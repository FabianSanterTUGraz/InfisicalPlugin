stages:
  - prepare
  - validate
  - publish

.base:
  image: eclipse-temurin:21-jdk-alpine
  before_script:
    - apk add --no-cache git
  variables:
    GIT_DEPTH : "1"
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'


prepare:
  extends: .base
  stage: prepare
  cache:
    key:
      files:
        - InfisicalPlugin/gradle/libs.versions.toml
        - InfisicalPlugin/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull-push
  script:
    - cd InfisicalPlugin
    - ./gradlew dependencies

test:
  extends: .base
  image: eclipse-temurin:21-jdk-jammy
  stage: validate
  needs: [prepare]
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git xvfb libxtst6 libxi6 libxrender1
  cache:
    key:
      files:
        - InfisicalPlugin/gradle/libs.versions.toml
        - InfisicalPlugin/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull
  script:
    - cd InfisicalPlugin
    - xvfb-run --auto-servernum ./gradlew test
  artifacts:
    when: always
    reports:
      junit: InfisicalPlugin/build/test-results/test/**/*.xml

verifyPlugin:
  extends: .base
  stage: validate
  needs: [prepare]
  variables:
    GRADLE_OPTS: "-Xmx4g"
  cache:
    key:
      files:
        - InfisicalPlugin/gradle/libs.versions.toml
        - InfisicalPlugin/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull
  script:
    - cd InfisicalPlugin
    - ./gradlew verifyPlugin
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - InfisicalPlugin/build/reports/pluginVerifier

buildPlugin:
  extends: .base
  stage: publish
  needs: [prepare,verifyPlugin]
  rules:
    - if: '$CI_COMMIT_TAG'
  cache:
    key:
      files:
        - InfisicalPlugin/gradle/libs.versions.toml
        - InfisicalPlugin/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull
  script:
    - cd InfisicalPlugin
    - VERSION="${CI_COMMIT_TAG#v}"
    - ./gradlew buildPlugin -Pversion="${VERSION}"
  artifacts:
    paths:
      - InfisicalPlugin/build/distributions/*.zip

publishPlugin:
  stage: publish
  image: alpine
  needs: ["buildPlugin"]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - apk add --no-cache unzip curl
    - ZIP_NAME=$(basename InfisicalPlugin/build/distributions/*.zip)
    - JAR_PATH=$(unzip -l InfisicalPlugin/build/distributions/*.zip | grep -o '[^ ]*/lib/[^ ]*\.jar$' | head -1)
    - unzip -p InfisicalPlugin/build/distributions/*.zip "$JAR_PATH" > /tmp/plugin.jar
    - unzip -p /tmp/plugin.jar META-INF/plugin.xml > /tmp/plugin.xml
    - VERSION=$(grep -o '<version>[^<]*</version>' /tmp/plugin.xml | sed -e 's/<version>//' -e 's/<\/version>//')
    - SINCE_BUILD=$(grep -o 'since-build="[^"]*"' /tmp/plugin.xml | head -1 | cut -d'"' -f2)
    - PACKAGE_NAME="infisical-plugin"
    - PACKAGE_API_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}"
    - ZIP_URL="${PACKAGE_API_URL}/${VERSION}/${ZIP_NAME}"
    - UPDATE_PLUGINS_URL="${PACKAGE_API_URL}/repository/updatePlugins.xml"
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "InfisicalPlugin/build/distributions/${ZIP_NAME}" \
        "${ZIP_URL}"
    - |
      cat > /tmp/updatePlugins.xml <<EOF
      <plugins>
        <plugin id="com.abuscom.infisicalplugin.InfisicalPlugin"
                url="${ZIP_URL}"
                version="${VERSION}">
          <idea-version since-build="${SINCE_BUILD}"/>
        </plugin>
      </plugins>
      EOF
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file /tmp/updatePlugins.xml \
        "${UPDATE_PLUGINS_URL}"
    - echo "Custom Plugin Repository URL (in IntelliJ eintragen) ${UPDATE_PLUGINS_URL}"