stages:
  - prepare
  - validate

.base:
  image: eclipse-temurin:21-jdk-alpine
  before_script:
    - apk add --no-cache git
  variables:
    GIT_DEPTH : "1"
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'


prepare:
  extends: .base
  stage: prepare
  cache:
    key:
      files:
        - InfisicalPlugin/gradle/libs.versions.toml
        - InfisicalPlugin/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull-push
  script:
    - cd InfisicalPlugin
    - ./gradlew dependencies

test:
  extends: .base
  image: eclipse-temurin:21-jdk-jammy
  stage: validate
  needs: [prepare]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git xvfb libxtst6 libxi6 libxrender1
  cache:
    key:
      files:
        - InfisicalPlugin/gradle/libs.versions.toml
        - InfisicalPlugin/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull
  script:
    - cd InfisicalPlugin
    - xvfb-run --auto-servernum ./gradlew test
  artifacts:
    when: always
    reports:
      junit: InfisicalPlugin/build/test-results/test/**/*.xml

verifyPlugin:
  extends: .base
  stage: validate
  needs: [prepare]
  cache:
    key:
      files:
        - InfisicalPlugin/gradle/libs.versions.toml
        - InfisicalPlugin/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull
  script:
    - cd InfisicalPlugin
    - ./gradlew verifyPlugin
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - InfisicalPlugin/build/reports/pluginVerifier
