stages:
  - prepare
  - validate
  - publish

.base:
  image: eclipse-temurin:21-jdk-alpine
  before_script:
    - apk add --no-cache git
  variables:
    GIT_DEPTH : "1"
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'


prepare:
  extends: .base
  stage: prepare
  cache:
    key:
      files:
        - InfisicalPlugin/gradle/libs.versions.toml
        - InfisicalPlugin/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull-push
  script:
    - cd InfisicalPlugin
    - ./gradlew dependencies

test:
  extends: .base
  image: eclipse-temurin:21-jdk-jammy
  stage: validate
  needs: [prepare]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git xvfb libxtst6 libxi6 libxrender1
  cache:
    key:
      files:
        - InfisicalPlugin/gradle/libs.versions.toml
        - InfisicalPlugin/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull
  script:
    - cd InfisicalPlugin
    - xvfb-run --auto-servernum ./gradlew test
  artifacts:
    when: always
    reports:
      junit: InfisicalPlugin/build/test-results/test/**/*.xml

verifyPlugin:
  extends: .base
  stage: validate
  needs: [prepare]
  cache:
    key:
      files:
        - InfisicalPlugin/gradle/libs.versions.toml
        - InfisicalPlugin/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull
  script:
    - cd InfisicalPlugin
    - ./gradlew verifyPlugin
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - InfisicalPlugin/build/reports/pluginVerifier

buildPlugin:
  extends: .base
  stage: publish
  needs: [prepare]
  rules:
    - if: '$CI_COMMIT_TAG'
  cache:
    key:
      files:
        - InfisicalPlugin/gradle/libs.versions.toml
        - InfisicalPlugin/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull
  script:
    - cd InfisicalPlugin
    - ./gradlew buildPlugin
  artifacts:
    paths:
      - InfisicalPlugin/build/distributions/*.zip

pages:
  stage: publish
  image: alpine
  needs: ["buildPlugin"]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Pages URL wird sein $CI_PAGES_URL"
    - apk add --no-cache unzip
    - mkdir -p public
    - cp InfisicalPlugin/build/distributions/*.zip public/
    - ZIP_NAME=$(basename InfisicalPlugin/build/distributions/*.zip)
    - JAR_PATH=$(unzip -l InfisicalPlugin/build/distributions/*.zip | grep -o '[^ ]*/lib/[^ ]*\.jar$' | head -1)
    - unzip -p InfisicalPlugin/build/distributions/*.zip "$JAR_PATH" | unzip -p - META-INF/plugin.xml > /tmp/plugin.xml
    - VERSION=$(grep -o '<version>[^<]*</version>' /tmp/plugin.xml | sed -e 's/<version>//' -e 's/<\/version>//')
    - SINCE_BUILD=$(grep -o 'since-build="[^"]*"' /tmp/plugin.xml | head -1 | cut -d'"' -f2)
    - |
      cat > public/updatePlugins.xml <<EOF
      <plugins>
        <plugin id="com.abuscom.infisicalplugin.InfisicalPlugin"
                url="${CI_PAGES_URL}/${ZIP_NAME}"
                version="${VERSION}">
          <idea-version since-build="${SINCE_BUILD}"/>
        </plugin>
      </plugins>
      EOF
  artifacts:
    paths:
      - public