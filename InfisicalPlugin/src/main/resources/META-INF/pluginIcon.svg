<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- document body (straight corners, folded top-right) -->
  <path d="M9,4 H25 L31,10 V36 H9 Z" fill="#FFFFFF" stroke="#8FA0AC" stroke-width="2" stroke-linejoin="round"/>
  <path d="M25,4 L25,10 L31,10 Z" fill="#E3E9ED" stroke="#8FA0AC" stroke-width="2" stroke-linejoin="round"/>

  <!-- ENV label, bold sans-serif, sized to stay legible at 40px -->
  <text x="20" y="32" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="9" fill="#5B6B77" text-anchor="middle">ENV</text>

  <!-- prohibition (no-entry) ring, 2px-aligned -->
  <circle cx="20" cy="20" r="15" fill="none" stroke="#E0242A" stroke-width="3"/>
  <line x1="9" y1="9" x2="31" y2="31" stroke="#E0242A" stroke-width="3" stroke-linecap="round"/>
</svg>
